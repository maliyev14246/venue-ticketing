<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Solstice Game Showcase – Tickets</title>
    <link rel="stylesheet" href="styles.css">
    <script defer src="script.js"></script>
  </head>
  <body>
    <header class="site-header">
      <h1>Solstice<br>Game Showcase</h1>
      <p class="event-info">Live from Los Angeles, June 12, 2:00 PM PT</p>
    </header>

    <main class="layout">
      <section id="venue-map" class="panel map-panel" aria-labelledby="map-title">
        <h2 id="map-title">Choose your seat</h2>
        <!-- Map navigation: zoom, move in four directions, reset -->
        <div class="map-controls" role="toolbar" aria-label="Map controls">
          <div class="control-group">
            <button type="button" data-action="zoom-out" aria-label="Zoom out" title="Zoom out">−</button>
            <button type="button" data-action="zoom-in" aria-label="Zoom in" title="Zoom in">+</button>
          </div>
          <div class="control-group">
            <button type="button" data-action="left" aria-label="Move left" title="Move left">←</button>
            <button type="button" data-action="up" aria-label="Move up" title="Move up">↑</button>
            <button type="button" data-action="down" aria-label="Move down" title="Move down">↓</button>
            <button type="button" data-action="right" aria-label="Move right" title="Move right">→</button>
          </div>
          <button type="button" data-action="reset" class="reset-button">Reset view</button>
        </div>
        <!-- The viewport is the visible window; the canvas holds the hall and will be zoomed/moved later -->
        <div class="map-viewport">
          <div id="map-canvas" class="map-canvas"></div>
        </div>
        <!-- Zone colours and seat states, filled in from script.js -->
        <ul id="legend" class="legend" aria-label="Map legend"></ul>
      </section>

      <aside id="seat-details" class="panel" aria-labelledby="details-title">
        <h2 id="details-title">Selected seat</h2>
        <!-- Filled in by script.js when a seat is clicked -->
        <div id="details-body" aria-live="polite">
          <p class="hint">Click a seat on the map to see its zone and price.</p>
        </div>
      </aside>

      <section id="cart" class="panel" aria-labelledby="cart-title">
        <h2 id="cart-title">My passes</h2>
        <p class="hint">No passes yet. Add a seat to start your order.</p>
      </section>
    </main>
  </body>
</html>
